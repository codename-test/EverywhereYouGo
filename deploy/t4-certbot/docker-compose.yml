# T4 — 懒人全自动（bridge + Nginx + Certbot，Let's Encrypt）
# 场景：个人 / 小团队云端，拥有公网域名。自动签发并续期免费证书。
# 前置：1) 域名已解析到本机公网 IP  2) 放通 80/443 端口
#
# 首次签发（先不要起 nginx，用 standalone 占用 80 端口签发一次）：
#   docker compose run --rm --service-ports certbot certonly --standalone \
#     -d your.domain --email you@example.com --agree-tos --no-eff-email
# 然后把 nginx.conf 里的 your.domain 改成你的域名，
# 再复制证书到 certs/ 目录：
#   cp /var/lib/docker/volumes/ego_certbot_conf/_data/live/your.domain/fullchain.pem certs/ego.crt
#   cp /var/lib/docker/volumes/ego_certbot_conf/_data/live/your.domain/privkey.pem   certs/ego.key
# 最后：
#   docker compose up -d
# 之后 certbot 容器会每 12h 续期，续期后需手动 cp 到 certs/（或用 renewal hook 自动化）。
services:
  ego:
    image: codenametest/everywhereyougo:latest
    container_name: ego
    ports:
      - "5001:5001"
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=5000
      - WEB_SSL_PORT=5001
      - DB_PATH=/app/data/ego.db
      - LOG_LEVEL=INFO
      - EGO_SSL_DIR=/app/certs
    volumes:
      - ego_data:/app/data
      - ego_config:/app/config
      - ./certs:/app/certs:ro
    networks:
      - ego_net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: ego-nginx
    depends_on:
      - ego
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - ego_net
    restart: unless-stopped
    # 轮询检测证书变化，自动 reload（每 60s 检查一次）
    entrypoint: /bin/sh -c '
      # 后台任务：检测证书文件变化
      (
        last_md5=""
        while true; do
          sleep 60
          if [ -f /etc/nginx/certs/ego.crt ] && [ -f /etc/nginx/certs/ego.key ]; then
            current_md5=$$(md5sum /etc/nginx/certs/ego.crt /etc/nginx/certs/ego.key 2>/dev/null | md5sum)
            if [ -n "$$last_md5" ] && [ "$$current_md5" != "$$last_md5" ]; then
              nginx -s reload
            fi
            last_md5="$$current_md5"
          fi
        done
      ) &
      # 前台启动 nginx
      nginx -g "daemon off;"
    '

  certbot:
    image: certbot/certbot
    container_name: ego-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - ./certs:/certs:rw              # 续期后自动复制证书到此目录
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook \"cp /etc/letsencrypt/live/*/fullchain.pem /certs/ego.crt && cp /etc/letsencrypt/live/*/privkey.pem /certs/ego.key && echo Certificate renewed and copied to certs/\"; sleep 12h & wait $${!}; done'"
    networks:
      - ego_net
    restart: unless-stopped

networks:
  ego_net:
    name: ego_net

volumes:
  ego_data:
  ego_config:
  certbot_www:
  certbot_conf:
