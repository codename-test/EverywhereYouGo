# T4 — 懒人全自动（bridge + Nginx + acme.sh，Let's Encrypt）
# 场景：个人 / 小团队云端，拥有公网域名。自动签发并续期免费证书。
#
# 证书分离设计：
#   - nginx 443: 使用 certs/ego.crt + ego.key（Let's Encrypt 证书）
#   - EGo 5001:  使用 certs/ego-selfsigned.crt + ego-selfsigned.key（自签名证书）
#
# 默认使用 webroot 模式（需要 80 端口），也支持 Cloudflare DNS API 验证。
#
# 方式一：webroot 模式（默认，需要域名解析到本机公网 IP）
#   docker compose up -d
#
# 方式二：Cloudflare DNS API 模式（不需要 80 端口）
#   设置环境变量 CF_Token 后启动：
#   CF_Token=your_token docker compose up -d
#
# 之后 acme.sh 容器会每 12h 自动续期，nginx 每 60s 检测证书变化并自动 reload。
services:
  ego:
    image: codenametest/everywhereyougo:latest
    container_name: ego
    ports:
      - "5001:5001"
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=5000
      - WEB_SSL_PORT=5001
      - DB_PATH=/app/data/ego.db
      - LOG_LEVEL=INFO
      - EGO_SSL_CERT=/app/certs/ego-selfsigned.crt
      - EGO_SSL_KEY=/app/certs/ego-selfsigned.key
      - EGO_SECRET_KEY=${EGO_SECRET_KEY:-}
    volumes:
      - ego_data:/app/data
      - ego_config:/app/config
      - ./certs:/app/certs:ro
    networks:
      - ego_net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: ego-nginx
    depends_on:
      - ego
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - acme_www:/var/www/acme:ro
    networks:
      - ego_net
    restart: unless-stopped
    entrypoint: /bin/sh -c '(last_md5=""; while true; do sleep 60; if [ -f /etc/nginx/certs/ego.crt ] && [ -f /etc/nginx/certs/ego.key ]; then current_md5=$$(md5sum /etc/nginx/certs/ego.crt /etc/nginx/certs/ego.key 2>/dev/null | md5sum); if [ -n "$$last_md5" ] && [ "$$current_md5" != "$$last_md5" ]; then nginx -s reload; fi; last_md5="$$current_md5"; fi; done) & nginx -g "daemon off;"'

  acme:
    image: neilpang/acme.sh
    container_name: ego-acme
    environment:
      - CF_Token=${CF_Token:-}
    volumes:
      - acme_www:/var/www/acme
      - acme_conf:/acme.sh
      - ./certs:/certs:rw
    networks:
      - ego_net
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; DOMAIN=$$(cat /certs/.domain 2>/dev/null || echo "your.domain"); if [ -n "$$CF_Token" ]; then echo "Using Cloudflare DNS API mode"; while :; do acme.sh --issue --dns dns_cf -d $$DOMAIN -d "*.$$DOMAIN" --server letsencrypt; if [ -d /acme.sh/$${DOMAIN}_ecc ]; then cp /acme.sh/$${DOMAIN}_ecc/fullchain.cer /certs/ego.crt; cp /acme.sh/$${DOMAIN}_ecc/$${DOMAIN}.key /certs/ego.key; else cp /acme.sh/$$DOMAIN/fullchain.cer /certs/ego.crt; cp /acme.sh/$$DOMAIN/$${DOMAIN}.key /certs/ego.key; fi; echo "Certificate renewed and copied to certs/"; sleep 12h & wait $${!}; done; else echo "Using webroot mode (requires port 80)"; while :; do acme.sh --issue --webroot /var/www/acme -d $$DOMAIN --server letsencrypt; if [ -d /acme.sh/$${DOMAIN}_ecc ]; then cp /acme.sh/$${DOMAIN}_ecc/fullchain.cer /certs/ego.crt; cp /acme.sh/$${DOMAIN}_ecc/$${DOMAIN}.key /certs/ego.key; else cp /acme.sh/$$DOMAIN/fullchain.cer /certs/ego.crt; cp /acme.sh/$$DOMAIN/$${DOMAIN}.key /certs/ego.key; fi; echo "Certificate renewed and copied to certs/"; sleep 12h & wait $${!}; done; fi'

networks:
  ego_net:
    name: ego_net

volumes:
  ego_data:
  ego_config:
  acme_www:
  acme_conf:
