# T4 Nginx — Let's Encrypt（acme.sh webroot 自动续期）
# 证书统一放在本目录 certs/ego.crt 与 certs/ego.key，与 T3 一致。
# 首次签发后需把证书复制到 certs/ 目录（见 docker-compose 注释）。
# 把所有 your.domain 改成你的域名。

server {
    listen 80;
    server_name your.domain;

    # ACME 挑战（证书签发 / 续期用，acme.sh webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # 其余请求一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your.domain;

    ssl_certificate     /etc/nginx/certs/ego.crt;
    ssl_certificate_key /etc/nginx/certs/ego.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    location / {
        proxy_pass http://ego:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
