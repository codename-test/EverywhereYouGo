# 默认 — 快速起步（bridge，内置自签名 HTTPS 双端口）
# 推荐新手的起始配置：管理页面 HTTPS(5001) + Webhook/健康检查 HTTP(5000)。
# 与 T2 基本一致，区别是本配置不加入自定义网络，独立运行。
# 访问：管理页面 https://<主机IP>:5001（自签名，浏览器需放行一次）；
#       Webhook / 健康检查 http://<主机IP>:5000
services:
  ego:
    image: codenametest/everywhereyougo:latest
    container_name: ego
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=5000
      - WEB_SSL_PORT=5001
      - DB_PATH=/app/data/ego.db
      - LOG_LEVEL=INFO
    volumes:
      - ego_data:/app/data
      - ego_config:/app/config
      - ego_certs:/app/certs       # 持久化自签名证书，重建容器后浏览器无需再次放行
    ports:
      - "5000:5000"
      - "5001:5001"
    restart: unless-stopped

volumes:
  ego_data:
  ego_config:
  ego_certs:
