# T3 Nginx — HTTPS 终结（手动证书），反代到 EGo HTTP 5000
# 证书路径：/etc/nginx/certs/ego.crt 与 /etc/nginx/certs/ego.key
# 把本目录下的 certs/ 放上你的证书；把下面 your.domain 改为你的域名（或保留 _ 通配）。
# 该 certs/ 目录同时被 EGo 自身使用，管理页面 5001 端口也走同一套证书。
# 用户在前端改 path_prefix，nginx 无需任何变更。

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your.domain;   # ← 改为你的域名，或保留 _ 通配
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your.domain;   # ← 与上面一致

    ssl_certificate     /etc/nginx/certs/ego.crt;
    ssl_certificate_key /etc/nginx/certs/ego.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 6m;   # 略大于 EGo 的 5MB body 上限

    location / {
        # 全部流量透传 EGo HTTP 5000，路径路由由 EGo 内部处理
        proxy_pass http://ego:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
