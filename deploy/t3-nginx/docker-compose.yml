# T3 — 企业级部署（bridge + Nginx，手动证书）
# 场景：正式生产环境。Nginx 负责 HTTPS 终结（80/443），
# 5001 直通 EGo 管理页面（与 nginx 共用同一份证书）。
# 前置：把你的证书放到本目录 certs/ego.crt 与 certs/ego.key。
services:
  ego:
    image: codenametest/everywhereyougo:latest
    container_name: ego
    ports:
      - "5001:5001"         # 管理页面直通（与 nginx 共用 certs/ 目录）
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=5000
      - WEB_SSL_PORT=5001
      - DB_PATH=/app/data/ego.db
      - LOG_LEVEL=INFO
      - EGO_SSL_DIR=/app/certs   # EGo 使用与 nginx 相同目录的证书
    volumes:
      - ego_data:/app/data
      - ego_config:/app/config
      - ./certs:/app/certs:ro     # 同一份证书，nginx 与 EGo 共用
    networks:
      - ego_net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: ego-nginx
    depends_on:
      - ego
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - ego_net
    restart: unless-stopped

networks:
  ego_net:
    name: ego_net

volumes:
  ego_data:
  ego_config:
