# T3 — 企业级部署（bridge + Nginx，手动证书）
# 场景：正式生产环境，自有证书。
#
# 证书规则（与 T4 一致）：
#   - EGo 5001：始终使用 Flask 自动生成的自签名证书（ego_certs 卷持久化），
#     浏览器直连 https://<IP>:5001 需放行一次证书警告。
#   - Nginx 80/443：使用你导入的证书（certs/ego.crt + ego.key），反代到 EGo 的 HTTP 5000。
#
# 前置：把你的证书放到本目录 certs/ego.crt 与 certs/ego.key。
# 端口：默认 80/443。可用环境变量 HTTP_PORT/HTTPS_PORT 覆盖（一键脚本会引导设置并写入）。
services:
  ego:
    image: codenametest/everywhereyougo:latest
    container_name: ego
    ports:
      - "5001:5001"             # 管理页面直连（Flask 自签名证书）
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=5000
      - WEB_SSL_PORT=5001
      - DB_PATH=/app/data/ego.db
      - LOG_LEVEL=INFO
      - EGO_SECRET_KEY=${EGO_SECRET_KEY:-}
    volumes:
      - ego_data:/app/data
      - ego_config:/app/config
      - ego_certs:/app/certs    # EGo 自签名证书（Flask 自动生成并持久化）
    networks:
      - ego_net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: ego-nginx
    depends_on:
      - ego
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - ego_net
    restart: unless-stopped

networks:
  ego_net:
    name: ego_net

volumes:
  ego_data:
  ego_config:
  ego_certs:
