# T4 — 懒人全自动（bridge + Nginx + acme.sh，Let's Encrypt，Cloudflare DNS 验证）
# 场景：个人 / 小团队云端，拥有公网域名。自动签发并续期免费证书。
#
# 证书规则（与 T3 一致）：
#   - EGo 5001：始终使用 Flask 自动生成的自签名证书（ego_certs 卷持久化），
#     浏览器直连 https://<IP>:5001 需放行一次证书警告。
#   - Nginx 80/443：使用 acme.sh 自动签发/续期的 Let's Encrypt 证书（certs/ego.crt + ego.key），
#     反代到 EGo 的 HTTP 5000。
#
# 采用 Cloudflare DNS API 验证：不需要 80 端口，适合 80 被占用 / 无公网 80 / 内网穿透。
# 端口：默认 80/443。可用环境变量 HTTP_PORT/HTTPS_PORT 覆盖（一键脚本会引导设置并写入）。
#
# 使用步骤：
#   1) 写入你的域名：      mkdir -p certs && echo "example.com" > certs/.domain
#   2) 改 nginx.conf：     把里面所有 your.domain 换成你的域名
#   3) 设置 Cloudflare Token（需 Zone:DNS:Edit 权限）后启动：
#        CF_Token=your_token docker compose up -d
#   4) acme.sh 经 DNS 验证签发证书（含通配符 *.example.com）写入 certs/，
#      nginx 检测到证书变化自动 reload；之后每 12h 自动续期。
#   注：首次启动 nginx 会重启几次，直到 acme.sh 签出证书，属正常现象。
services:
  ego:
    image: codenametest/everywhereyougo:latest
    container_name: ego
    ports:
      - "5001:5001"             # 管理页面直连（Flask 自签名证书）
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=5000
      - WEB_SSL_PORT=5001
      - DB_PATH=/app/data/ego.db
      - LOG_LEVEL=INFO
      - EGO_SECRET_KEY=${EGO_SECRET_KEY:-}
    volumes:
      - ego_data:/app/data
      - ego_config:/app/config
      - ego_certs:/app/certs    # EGo 自签名证书（Flask 自动生成并持久化）
    networks:
      - ego_net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: ego-nginx
    depends_on:
      - ego
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - ego_net
    restart: unless-stopped
    # 每 60s 检测证书变化，变化则 reload（acme.sh 续期后自动生效）
    entrypoint: /bin/sh -c '(last_md5=""; while true; do sleep 60; if [ -f /etc/nginx/certs/ego.crt ] && [ -f /etc/nginx/certs/ego.key ]; then current_md5=$$(md5sum /etc/nginx/certs/ego.crt /etc/nginx/certs/ego.key 2>/dev/null | md5sum); if [ -n "$$last_md5" ] && [ "$$current_md5" != "$$last_md5" ]; then nginx -s reload; fi; last_md5="$$current_md5"; fi; done) & nginx -g "daemon off;"'

  acme:
    image: neilpang/acme.sh
    container_name: ego-acme
    environment:
      - CF_Token=${CF_Token:-}
    volumes:
      - acme_conf:/acme.sh
      - ./certs:/certs:rw
    networks:
      - ego_net
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; if [ -z "$$CF_Token" ]; then echo "ERROR - T4 requires CF_Token (Cloudflare DNS mode); set the CF_Token env var."; exit 1; fi; DOMAIN=$$(cat /certs/.domain 2>/dev/null || echo ""); if [ -z "$$DOMAIN" ] || [ "$$DOMAIN" = "your.domain" ]; then echo "ERROR - put your domain into certs/.domain first."; exit 1; fi; echo "Using Cloudflare DNS API mode for $$DOMAIN"; while :; do acme.sh --issue --dns dns_cf -d $$DOMAIN -d "*.$$DOMAIN" --server letsencrypt; if [ -d /acme.sh/$${DOMAIN}_ecc ]; then cp /acme.sh/$${DOMAIN}_ecc/fullchain.cer /certs/ego.crt; cp /acme.sh/$${DOMAIN}_ecc/$${DOMAIN}.key /certs/ego.key; else cp /acme.sh/$$DOMAIN/fullchain.cer /certs/ego.crt; cp /acme.sh/$$DOMAIN/$${DOMAIN}.key /certs/ego.key; fi; echo "Certificate issued/renewed and copied to certs/"; sleep 12h & wait $$!; done'

networks:
  ego_net:
    name: ego_net

volumes:
  ego_data:
  ego_config:
  ego_certs:
  acme_conf:
