# T4 Nginx — HTTPS 终结（acme.sh 自动证书），反代到 EGo HTTP 5000
# 证书路径：/etc/nginx/certs/ego.crt 与 /etc/nginx/certs/ego.key（acme.sh 自动签发/续期）。
# 把下面所有 your.domain 改为你的域名。
# 说明：EGo 5001 使用自签名证书（独立于本目录）；nginx 443 使用 acme.sh 写入的 Let's Encrypt 证书。
# 若通过一键脚本改用非 443 的 HTTPS 端口，脚本会自动修正下方跳转目标。

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your.domain;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your.domain;

    ssl_certificate     /etc/nginx/certs/ego.crt;
    ssl_certificate_key /etc/nginx/certs/ego.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 6m;   # 略大于 EGo 的 5MB body 上限

    location / {
        # 全部流量透传 EGo HTTP 5000，路径路由由 EGo 内部处理
        proxy_pass http://ego:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
